<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR PLUS - Download App</title>
  
  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/tPNB0z16/file-00000000aa2c820a9898ba0239b09865.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      /* Blurred Background + Dark Overlay */
      background: linear-gradient(rgba(0, 15, 40, 0.82), rgba(0, 5, 20, 0.92)),
                  url('https://i.ibb.co/Z1Lv6mtm/Screenshot-2026-10-17-18-57-23-74-2b0517aad3b313c6341521197eee0d28.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px 40px;
      color: #fff;
    }

    /* Logo Styling */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 140px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
    }

    /* Real Download Button Styling */
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(45deg, #ff0000, #ff5500);
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      padding: 15px 38px;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(255, 50, 0, 0.6);
      border: 2px solid #ffffff;
      margin-bottom: 25px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulse 1.5s infinite;
    }

    .download-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* App Screenshots Container */
    .screenshots {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .screenshots img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <!-- Top Logo -->
  <div class="logo-container">
    <img src="https://i.ibb.co/tPNB0z16/file-00000000aa2c820a9898ba0239b09865.png" alt="SR PLUS Logo">
  </div>

  <!-- Main Download Button -->
  <a href="https://devuploads.com/aulbrpit8kv9" class="download-btn" download>
    ⬇ DOWNLOAD APK
  </a>

  <!-- Both Images (Full View without cutting) -->
  <div class="screenshots">
    <img src="https://i.ibb.co/Z1Lv6mtm/Screenshot-2026-10-17-18-57-23-74-2b0517aad3b313c6341521197eee0d28.jpg" alt="Screenshot 1">
    <img src="https://i.ibb.co/bg6Bdqfc/Screenshot-2026-10-17-18-58-27-64-2b0517aad3b313c6341521197eee0d28.jpg" alt="Screenshot 2">
  </div>

</body>
</html>
